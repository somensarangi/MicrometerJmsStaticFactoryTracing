name: CI

on:
  push:
    branches: [ "dev","stg" ]
    tags: [ "v*" ]

  workflow_dispatch:
  
# This is environment variable 1
# env:
#   FILE_NAME: Changelog.MD

jobs:
  build:
    runs-on: ubuntu-latest
    
    # env:
    #   inside: inside_build

    steps:
      - uses: actions/checkout@v4

      #      - name: Call from secret
      #        run: echo ${{ secrets.INITIAL_TOKEN }}
      #
      #      - name: Call from variable
      #        run: echo ${{ vars.INITIAL_VARIABLE }}

      # - name: Run a one-line script
      #   run: | 
      #     echo Hello, world! $FILE_NAME
      #     echo $inside
      #     echo $outside

      # - name: Run a multi-line script
      #   run: |
      #     echo Hello, world! $FILE_NAME
      #     echo $inside
      #     echo $outside
      #   env: 
      #     outside: inside_step

      - name: build
        run: docker build -t somendocker/webapp:latest -t somendocker/webapp:$GITHUB_REF_NAME -f Dockerfile .

      - name: login
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: push
        run: | 
          docker push somendocker/webapp:latest
          docker push somendocker/webapp:$GITHUB_REF_NAME
